services:
  - type: web
    name: velvet-residence-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: ORACLE_MOCK
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
